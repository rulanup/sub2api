name: Ent Generate (temporary)
on:
  push:
    branches:
      - refactor/group-system-prompt-single
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate ent and wire
        run: |
          cd backend
          go generate ./ent
          go generate ./cmd/server
      - name: Commit generated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A backend/ent backend/cmd/server
          if git diff --cached --quiet; then
            echo "no generated changes"
          else
            git commit -m "chore(codegen): regenerate ent for single group system prompt"
            git push
          fi
